name: Refresh README cards

on:
  schedule:
    - cron: "17 11 * * *" # daily, 7:17 ET
  workflow_dispatch:
  push:
    paths: ["data/profile.json", "scripts/**"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli
      - run: python scripts/fetch_contributions.py
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRIB_TOKEN || secrets.GITHUB_TOKEN }}
      - run: python scripts/render_cards.py
      - run: python scripts/build_readme.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards README.md
          git diff --cached --quiet || git commit -m "Refresh README cards"
          git push
